<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pago Seguro</title>

<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
<meta name="referrer" content="no-referrer">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4a148c, #7b1fa2);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 360px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
  color: #6a1b9a;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 7px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  background: #6a1b9a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #4a148c;
}

.cvv-container {
  position: relative;
}

.toggle-cvv {
  position: absolute;
  right: 10px;
  top: 12px;
  cursor: pointer;
  font-size: 12px;
  color: #6a1b9a;
}

.section-title {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<div class="container">
  <h2>Pago Seguro</h2>

  <form method="POST" action="/api/payment/3d-secure" autocomplete="off">

    <div class="section-title">Datos personales</div>
    <input name="nombre" placeholder="Nombre completo" required>
    <input name="correo" type="email" placeholder="Correo electrónico" required>
    <input name="telefono" placeholder="Teléfono" pattern="\d{10}" required>

    <div class="section-title">Dirección de facturación</div>
    <input name="direccion" placeholder="Dirección" required>
    <input name="ciudad" placeholder="Ciudad" required>
    <input name="cp" placeholder="Código Postal" pattern="\d{5}" required>

    <div class="section-title">Tipo de tarjeta</div>
    <select name="tipoTarjeta" required>
      <option value="">Selecciona</option>
      <option value="CR">Crédito</option>
      <option value="DB">Débito</option>
    </select>

    <div class="section-title">Datos de la tarjeta</div>

    <input 
      name="cardNumber" 
      placeholder="Número de tarjeta" 
      maxlength="16"
      pattern="\d{15,16}" 
      inputmode="numeric"
      required
    >

    <input 
      name="cardExp" 
      placeholder="MM/AA" 
      maxlength="5"
      pattern="\d{2}/\d{2}"
      required
    >

    <div class="cvv-container">
      <input 
        id="cvv" 
        name="cvv" 
        type="password" 
        placeholder="CVV" 
        maxlength="4"
        pattern="\d{3,4}"
        required
      >
      <span class="toggle-cvv" onclick="toggleCVV()">Ver</span>
    </div>

    <input 
      name="amount" 
      type="number"
      min="1"
      max="9999999.99"
      step="0.01"
      placeholder="Monto"
      required
    >

    <button type="submit">Pagar</button>

    <p style="font-size:12px; color:gray; text-align:center;">
      Tus datos se usan únicamente para validar el pago de forma segura.
    </p>

  </form>
</div>

<script>
// Mostrar / ocultar CVV
function toggleCVV() {
  const cvv = document.getElementById("cvv");
  cvv.type = cvv.type === "password" ? "text" : "password";
}

// Formato MM/AA automático
document.querySelector('[name="cardExp"]').addEventListener("input", e => {
  let val = e.target.value.replace(/\D/g, "");
  if (val.length >= 2) val = val.slice(0,2) + "/" + val.slice(2,4);
  e.target.value = val;
});

// Solo números tarjeta
document.querySelector('[name="cardNumber"]').addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0,16);
});

// Solo números teléfono
document.querySelector('[name="telefono"]').addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0,10);
});

// Solo números CP
document.querySelector('[name="cp"]').addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0,5);
});
</script>

</body>
</html>
